name: Build Russian DLL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-russian.yml'
      - '.github/scripts/apply_ru_patch.py'
      - '.github/scripts/apply_ru_patch_safe.py'
      - 'nuget.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic log
        run: |
          mkdir -p .github
          {
            echo "Russian MalumMenu build diagnostic"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "runner=${{ runner.os }}"
            echo
          } > .github/last-build.log

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply full Russian UI patch safely
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_ru_patch_safe.py 2>&1 | tee -a .github/last-build.log

      - name: Build Release DLL
        shell: bash
        run: |
          set -o pipefail
          echo "--- dotnet build ---" | tee -a .github/last-build.log
          dotnet --info 2>&1 | tee -a .github/last-build.log
          dotnet build src/MalumMenu.csproj -c Release 2>&1 | tee -a .github/last-build.log

      - name: Verify DLL
        shell: bash
        run: |
          set -o pipefail
          echo "--- verify output ---" | tee -a .github/last-build.log
          test -f src/bin/Release/net6.0/MalumMenu.dll
          ls -lh src/bin/Release/net6.0/MalumMenu.dll | tee -a .github/last-build.log

      - name: Upload Russian MalumMenu DLL
        uses: actions/upload-artifact@v4
        with:
          name: MalumMenu-3.2.0-FULL-RU-Epic
          path: src/bin/Release/net6.0/MalumMenu.dll
          if-no-files-found: error
          retention-days: 30

      - name: Save diagnostic log to repository
        if: always()
        shell: bash
        run: |
          if [ ! -f .github/last-build.log ]; then
            echo "Build failed before diagnostic log was initialized." > .github/last-build.log
          fi
          {
            echo
            echo "job_status=${{ job.status }}"
            echo "run_id=${{ github.run_id }}"
          } >> .github/last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-build.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Russian build log [skip ci]"
            git push
          fi
