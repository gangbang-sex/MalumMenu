name: Build Russian DLL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-russian.yml'
      - '.github/scripts/apply_ru_patch.py'
      - '.github/scripts/apply_ru_patch_safe.py'
      - 'nuget.config'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply full Russian UI patch safely
        run: python .github/scripts/apply_ru_patch_safe.py

      - name: Build Release DLL
        run: dotnet build src/MalumMenu.csproj -c Release

      - name: Verify DLL
        run: |
          test -f src/bin/Release/net6.0/MalumMenu.dll
          ls -lh src/bin/Release/net6.0/MalumMenu.dll

      - name: Upload Russian MalumMenu DLL
        uses: actions/upload-artifact@v4
        with:
          name: MalumMenu-3.2.0-FULL-RU-Epic
          path: src/bin/Release/net6.0/MalumMenu.dll
          if-no-files-found: error
          retention-days: 30
