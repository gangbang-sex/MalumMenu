name: Build Russian DLL

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-russian.yml'
      - '.github/scripts/apply_ru_patch.py'
      - '.github/scripts/apply_ru_patch_safe.py'
      - 'nuget.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostic log
        shell: bash
        run: |
          mkdir -p .github
          {
            echo "Russian MalumMenu build diagnostic"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "runner=${{ runner.os }}"
            echo
          } > .github/last-build.log

      - name: Setup .NET 6
        id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch and build with captured diagnostics
        id: patch_build
        if: always() && steps.setup_dotnet.outcome == 'success' && steps.setup_python.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -o pipefail

          echo "--- Russian patch ---" | tee -a .github/last-build.log
          python .github/scripts/apply_ru_patch_safe.py 2>&1 | tee -a .github/last-build.log
          PATCH_EXIT=${PIPESTATUS[0]}
          echo "patch_exit=$PATCH_EXIT" | tee -a .github/last-build.log

          if [ "$PATCH_EXIT" -ne 0 ]; then
            echo "BUILD_EXIT=$PATCH_EXIT" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "--- dotnet info ---" | tee -a .github/last-build.log
          dotnet --info 2>&1 | tee -a .github/last-build.log

          echo "--- dotnet build ---" | tee -a .github/last-build.log
          dotnet build src/MalumMenu.csproj -c Release 2>&1 | tee -a .github/last-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "build_exit=$BUILD_EXIT" | tee -a .github/last-build.log
          echo "BUILD_EXIT=$BUILD_EXIT" >> "$GITHUB_ENV"
          exit 0

      - name: Verify DLL
        if: env.BUILD_EXIT == '0'
        shell: bash
        run: |
          set -o pipefail
          echo "--- verify output ---" | tee -a .github/last-build.log
          test -f src/bin/Release/net6.0/MalumMenu.dll
          ls -lh src/bin/Release/net6.0/MalumMenu.dll | tee -a .github/last-build.log

      - name: Upload Russian MalumMenu DLL
        if: env.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: MalumMenu-3.2.0-FULL-RU-Epic
          path: src/bin/Release/net6.0/MalumMenu.dll
          if-no-files-found: error
          retention-days: 30

      - name: Persist diagnostic log via Contents API
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/last-build.log';
            let log = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'No diagnostic log file was produced.\n';
            log += `\nsetup_dotnet=${{ steps.setup_dotnet.outcome }}\n`;
            log += `setup_python=${{ steps.setup_python.outcome }}\n`;
            log += `patch_build=${{ steps.patch_build.outcome }}\n`;
            log += `build_exit=${process.env.BUILD_EXIT || 'not-set'}\n`;
            log += `job_status=${{ job.status }}\n`;
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              sha = current.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'ci: persist Russian build diagnostics [skip ci]',
              content: Buffer.from(log, 'utf8').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });

      - name: Mark build failed when compilation failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.setup_dotnet.outcome }}" != "success" ] || \
             [ "${{ steps.setup_python.outcome }}" != "success" ] || \
             [ "${BUILD_EXIT:-1}" != "0" ]; then
            exit 1
          fi
